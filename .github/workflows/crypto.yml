name: crypto

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    env:
      GOEXPERIMENT: simd

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false

      - name: Vet
        run: go vet ./chacha20/ ./crypto/blake3/ ./crypto/chacha20blake3/

      - name: Test
        run: |
          go test -race ./chacha20/ ./crypto/blake3/ ./crypto/chacha20blake3/

      - name: Benchmark
        run: |
          cat /proc/cpuinfo
          go test -bench=. -benchmem ./crypto/blake3
          go test -bench=. -benchmem ./chacha20
          go test -bench=. -benchmem ./crypto/chacha20blake3
